[project]
name = "job-aggregator"
version = "0.1.0"
description = "Job aggregator API with Django and DRF"
authors = [
    {name = "Sergey Zaprudnov",email = "szaprudnov@hotmail.com"}
]
license = "\"MIT\""
requires-python = ">=3.11,<4.0"
dependencies = [
    "djangorestframework (>=3.18.3,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "celery (>=5.7.0,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "ruff (>=0.17.4,<0.18.0)"
]
